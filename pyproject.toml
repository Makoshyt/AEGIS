[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ia"
version = "0.1.0"
description = "AEGIS IA — assistente pessoal local para Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
